name: Deploy Docker image to Windows runner

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]

env:
  IMAGE_NAME: personal-expense-tracker
  APP_CONTAINER: personal-expense-tracker
  DATA_VOLUME: personal-expense-tracker-data
  APP_PORT: '8000'

jobs:
  deploy:
    # Only a successful main-branch push publishes an image and may deploy.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: read
    steps:
      - name: Verify Docker environment
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: |
          $ErrorActionPreference = 'Stop'
          docker context use desktop-linux
          docker info
          if ($LASTEXITCODE -ne 0) { throw 'Docker Desktop daemon is not available.' }

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest image
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          docker pull $env:IMAGE
          if ($LASTEXITCODE -ne 0) { throw "Image pull failed: $env:IMAGE" }

      - name: Replace running app container
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Docker([string[]]$Args) { & docker @Args; if ($LASTEXITCODE -ne 0) { throw "docker $($Args -join ' ') failed with exit code $LASTEXITCODE" } }
          $oldImage = ''
          $oldExists = docker ps -aq --filter "name=^/${env:APP_CONTAINER}$"
          if ($oldExists) { $oldImage = (docker inspect --format '{{.Config.Image}}' $env:APP_CONTAINER).Trim() }
          Invoke-Docker @('volume','create',$env:DATA_VOLUME)
          $candidate = "${env:APP_CONTAINER}-candidate"
          docker rm -f $candidate 2>$null
          Invoke-Docker @('run','-d','--name',$candidate,'-e','APP_VERSION=1.0','-p','127.0.0.1:18000:8000','-v',"${env:DATA_VOLUME}:/app/data",$env:IMAGE)
          $healthy = $false
          1..30 | ForEach-Object { if (-not $healthy) { try { if ((Invoke-WebRequest 'http://127.0.0.1:18000/api/health' -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { $healthy=$true } } catch { Start-Sleep -Seconds 2 } } }
          if (-not $healthy) { docker logs $candidate; throw 'New image health check failed; old container was preserved.' }
          if ($oldExists) { Invoke-Docker @('rm','-f',$env:APP_CONTAINER) }
          try {
            Invoke-Docker @('run','-d','--name',$env:APP_CONTAINER,'--restart','unless-stopped','-e','APP_VERSION=1.0','-p',"${env:APP_PORT}:8000",'-v',"${env:DATA_VOLUME}:/app/data",$env:IMAGE)
            Invoke-Docker @('rm','-f',$candidate)
          } catch {
            if ($oldImage) { docker rm -f $env:APP_CONTAINER 2>$null; Invoke-Docker @('run','-d','--name',$env:APP_CONTAINER,'--restart','unless-stopped','-p',"${env:APP_PORT}:8000",'-v',"${env:DATA_VOLUME}:/app/data",$oldImage) }
            throw
          }

      - name: Verify application health
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: |
          $ErrorActionPreference = 'Stop'
          $response = Invoke-WebRequest 'http://127.0.0.1:8000/api/health' -UseBasicParsing -TimeoutSec 10
          if ($response.StatusCode -ne 200) { throw 'Application health check failed.' }
          $version = Invoke-RestMethod 'http://127.0.0.1:8000/api/version'
          $summary = Invoke-RestMethod 'http://127.0.0.1:8000/api/summary'
          if (-not $version.version -or $null -eq $summary.balance) { throw 'Application API verification failed.' }
          Write-Host "Application is healthy. Version=$($version.version) Balance=$($summary.balance)"

      - name: Post Log in to Docker Hub
        if: always()
        run: docker logout

      - name: Complete job
        if: success()
        run: Write-Host 'Deployment completed successfully.'
