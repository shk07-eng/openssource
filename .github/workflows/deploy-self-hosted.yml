name: Deploy Docker image to self-hosted runner

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]

env:
  IMAGE_NAME: personal-expense-tracker
  CONTAINER_NAME: personal-expense-tracker
  HOST_PORT: '8000'

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: read
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image published by CI
        shell: powershell
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
        run: docker pull $env:IMAGE

      - name: Replace running container
        shell: powershell
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = docker ps -aq --filter "name=^/${env:CONTAINER_NAME}$"
          if ($existing) { docker rm -f $env:CONTAINER_NAME }
          docker run -d --name $env:CONTAINER_NAME --restart unless-stopped `
            -p "${env:HOST_PORT}:8000" `
            -v "personal-expense-tracker-data:/app/data" `
            $env:IMAGE

      - name: Verify deployed service
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $healthy = $false
          1..30 | ForEach-Object {
            if (-not $healthy) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:${env:HOST_PORT}/health" -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200) { $healthy = $true }
              } catch { Start-Sleep -Seconds 2 }
            }
          }
          if (-not $healthy) {
            docker logs $env:CONTAINER_NAME
            throw 'Deployed container did not pass the health check.'
          }
          Write-Host 'Deployed service is healthy.'

