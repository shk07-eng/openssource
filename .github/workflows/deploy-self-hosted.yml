name: Deploy Docker image to self-hosted runner

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]

env:
  IMAGE_NAME: personal-expense-tracker
  DATA_VOLUME: personal-expense-tracker-data
  PROXY_NAME: personal-expense-proxy

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull Version 2 image
        shell: powershell -ExecutionPolicy Bypass -File "{0}"
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
        run: docker pull $env:IMAGE
      - name: Start green and switch proxy after health check
        shell: powershell -ExecutionPolicy Bypass -File "{0}"
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $oldConfig='proxy/nginx-v1.conf'; $newConfig='proxy/nginx-v2.conf'
          if (-not (docker ps -aq --filter 'name=^/expense-v1$')) { docker run -d --name expense-v1 --restart unless-stopped -e APP_VERSION=1.0 -p 127.0.0.1:18081:8000 -v "${env:DATA_VOLUME}:/app/data" $env:IMAGE }
          if (docker ps -aq --filter 'name=^/expense-v2$') { docker rm -f expense-v2 }
          docker run -d --name expense-v2 --restart unless-stopped -e APP_VERSION=2.0 -p 127.0.0.1:18082:8000 -v "${env:DATA_VOLUME}:/app/data" $env:IMAGE
          $ok=$false; 1..30 | ForEach-Object { if (-not $ok) { try { if ((Invoke-WebRequest http://127.0.0.1:18082/api/health -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) {$ok=$true} } catch {Start-Sleep 2} } }
          if (-not $ok) { docker logs expense-v2; throw 'Version 2 health check failed; proxy was not switched.' }
          if (-not (docker ps -aq --filter 'name=^/personal-expense-proxy$')) { docker run -d --name $env:PROXY_NAME --restart unless-stopped -p 8000:80 nginx:1.27-alpine }
          docker cp $oldConfig "$env:PROXY_NAME:/etc/nginx/nginx.conf"; docker exec $env:PROXY_NAME nginx -s reload
          Start-Sleep 2
          docker cp $newConfig "$env:PROXY_NAME:/etc/nginx/nginx.conf"; docker exec $env:PROXY_NAME nginx -s reload
          if ((Invoke-WebRequest http://127.0.0.1:8000/api/version -UseBasicParsing).Content -notmatch '2.0') { throw 'Proxy did not switch to Version 2.' }
      - name: Verify deployed service and CRUD
        shell: powershell -ExecutionPolicy Bypass -File "{0}"
        run: |
          $ErrorActionPreference='Stop'; $base='http://127.0.0.1:8000'; $s=Invoke-RestMethod "$base/api/summary"; if ($s.version -ne '2.0') {throw 'Expected Version 2 summary'}; $b=@{type='expense';date=(Get-Date -Format yyyy-MM-dd);amount=1;category='기타';memo='deployment smoke test'}|ConvertTo-Json; $x=Invoke-RestMethod "$base/api/transactions" -Method Post -ContentType 'application/json' -Body $b; Invoke-RestMethod "$base/api/transactions/$($x.id)" -Method Delete|Out-Null; Write-Host 'Blue-green health and CRUD verification passed.'
      - name: Roll back proxy on failure
        if: failure()
        shell: powershell -ExecutionPolicy Bypass -File "{0}"
        run: |
          if (docker ps -aq --filter 'name=^/personal-expense-proxy$') { docker cp proxy/nginx-v1.conf $env:PROXY_NAME:/etc/nginx/nginx.conf; docker exec $env:PROXY_NAME nginx -s reload }
          if (docker ps -aq --filter 'name=^/expense-v2$') { docker rm -f expense-v2 }
          docker logs expense-v2 2>$null
