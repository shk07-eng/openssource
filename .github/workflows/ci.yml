name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE_NAME: personal-expense-tracker
  IMAGE_REPO: ${{ github.event_name == 'push' && secrets.DOCKERHUB_USERNAME || 'local' }}

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate application and database initialization
        run: |
          python -m compileall -q app
          python -c "from app.main import app, conn; conn(); print(app.title); print('database initialized')"
          test -f data/expenses.db
          rm -f data/expenses.db

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

