<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 가계부</title><link rel="stylesheet" href="/static/style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body><main><header><div><p class="eyebrow">PERSONAL FINANCE</p><h1>나의 가계부</h1><p class="muted">오늘의 소비를 기록하고 흐름을 한눈에 확인하세요.</p></div><button id="addBtn">＋ 거래 추가</button></header><section class="cards"><article><span>총수입</span><strong id="income">₩0</strong></article><article><span>총지출</span><strong id="expense">₩0</strong></article><article><span>현재 잔액</span><strong id="balance">₩0</strong></article><article><span>이번 달 지출</span><strong id="monthly">₩0</strong></article></section><section class="charts"><article><h2>카테고리별 지출</h2><canvas id="pie"></canvas></article><article><h2>월별 수입 · 지출</h2><canvas id="bar"></canvas></article></section><section class="panel"><div class="panel-head"><h2>거래 내역</h2><div class="filters"><input type="date" id="start"><input type="date" id="end"><select id="filter"><option value="">전체 카테고리</option><option>식비</option><option>교통비</option><option>쇼핑</option><option>문화생활</option><option>주거/통신</option><option>기타</option></select><button onclick="load()">검색</button></div></div><div class="table-wrap"><table><thead><tr><th>날짜</th><th>구분</th><th>카테고리</th><th>메모</th><th>금액</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main><dialog id="modal"><form method="dialog" id="form"><h2 id="formTitle">거래 추가</h2><input type="hidden" id="tid"><label>구분<select id="type"><option value="expense">지출</option><option value="income">수입</option></select></label><label>날짜<input type="date" id="date" required></label><label>금액<input type="number" id="amount" min="1" required></label><label>카테고리<select id="category" required><option value="">선택하세요</option><option>식비</option><option>교통비</option><option>쇼핑</option><option>문화생활</option><option>주거/통신</option><option>급여</option><option>기타</option></select></label><label>메모<input id="memo" maxlength="200"></label><div class="actions"><button type="button" onclick="modal.close()">취소</button><button class="primary">저장</button></div><p id="error" class="error"></p></form></dialog><script src="/static/app.js"></script></body></html>
